# AI/BI scoping dashboard — reads ONLY the persisted control tables.
# NOTE: serialized inline (not file_path) so DABs substitutes ${var.dataset_catalog}/
# ${var.dataset_schema} into FULLY-QUALIFIED table names. AI/BI does not reliably apply
# the dataset_catalog/dataset_schema resource fields as the query context, so we qualify
# every FROM clause here instead (still parameterized, no hardcoded catalog/schema).
resources:
  dashboards:
    migration_scope:
      display_name: "[${bundle.target}] External -> Managed -- Migration Scope"
      warehouse_id: ${var.warehouse_id}
      serialized_dashboard: |
        {
          "datasets": [
            {
              "name": "action_summary",
              "displayName": "Action summary",
              "queryLines": [
                "SELECT catalog, schema, action_kind, total, open, in_progress, done, obsolete, open_blocking FROM ${var.dataset_catalog}.${var.dataset_schema}.action_summary"
              ]
            },
            {
              "name": "action_queue_open",
              "displayName": "Open action queue",
              "queryLines": [
                "SELECT blocking, phase, action_kind, status, catalog, schema, full_name, target_kind, target_id, title, confidence, owner, detected_at FROM ${var.dataset_catalog}.${var.dataset_schema}.action_queue_open"
              ]
            },
            {
              "name": "compaction_sources",
              "displayName": "Compaction sources",
              "queryLines": [
                "SELECT catalog, schema, full_name, actor_kind, actor_id, actor_name, is_recurring, compaction_count, last_compaction_at, confidence FROM ${var.dataset_catalog}.${var.dataset_schema}.compaction_sources"
              ]
            },
            {
              "name": "convert_windows",
              "displayName": "Convert windows (predictive)",
              "queryLines": [
                "SELECT catalog, schema, full_name, COALESCE(state, 'UNKNOWN') AS state, CASE WHEN convert_window_ready THEN 1 ELSE 0 END AS ready_now, COALESCE(convert_window_confidence, 'low') AS confidence, ROUND(COALESCE(convert_window_slack_min, 0), 1) AS slack_min, ROUND(COALESCE(write_interval_p50_s, 0) / 60.0, 1) AS gap_p50_min, ROUND(COALESCE(write_interval_p90_s, 0) / 60.0, 1) AS gap_p90_min, ROUND(COALESCE(est_downtime_minutes, 0), 1) AS est_downtime_minutes, predicted_next_write_at, last_write_at, window_scanned_at, COALESCE(convert_window_notes, '') AS notes FROM ${var.dataset_catalog}.${var.dataset_schema}.table_manifest WHERE convert_window_confidence IS NOT NULL"
              ]
            },
            {
              "name": "summary",
              "displayName": "Scope summary",
              "queryLines": [
                "SELECT catalog, schema, CASE WHEN eligibility = 'ELIGIBLE' THEN 1 ELSE 0 END AS is_eligible, CASE WHEN eligibility = 'BLOCKED' THEN 1 ELSE 0 END AS is_blocked, CASE WHEN eligibility = 'NEEDS_REVIEW' THEN 1 ELSE 0 END AS is_needs_review, COALESCE(table_size_bytes, 0) AS table_size_bytes, COALESCE(est_data_copy_minutes, 0) AS est_data_copy_minutes, COALESCE(est_data_copy_seconds, 0) AS est_data_copy_seconds, COALESCE(est_downtime_minutes, 0) AS est_downtime_minutes FROM ${var.dataset_catalog}.${var.dataset_schema}.table_manifest"
              ]
            },
            {
              "name": "eligibility",
              "displayName": "Eligibility breakdown",
              "queryLines": [
                "SELECT catalog, schema, eligibility, COUNT(*) AS table_count FROM ${var.dataset_catalog}.${var.dataset_schema}.table_manifest GROUP BY catalog, schema, eligibility"
              ]
            },
            {
              "name": "size_band",
              "displayName": "Size bands",
              "queryLines": [
                "SELECT catalog, schema, COALESCE(size_band, 'unknown') AS size_band, COUNT(*) AS table_count, SUM(COALESCE(table_size_bytes, 0)) AS total_bytes, ROUND(SUM(COALESCE(est_data_copy_minutes, 0)), 1) AS copy_minutes FROM ${var.dataset_catalog}.${var.dataset_schema}.table_manifest GROUP BY catalog, schema, COALESCE(size_band, 'unknown')"
              ]
            },
            {
              "name": "risk",
              "displayName": "Risk flags",
              "queryLines": [
                "SELECT catalog, schema, CASE WHEN uniform_iceberg_enabled THEN 1 ELSE 0 END AS uniform_iceberg, CASE WHEN is_delta_shared THEN 1 ELSE 0 END AS delta_shared, CASE WHEN has_external_non_databricks_writer THEN 1 ELSE 0 END AS external_writer, CASE WHEN needs_compatibility_mode THEN 1 ELSE 0 END AS needs_compat, CASE WHEN has_streaming_writer THEN 1 ELSE 0 END AS streaming, CASE WHEN has_below_floor_consumer THEN 1 ELSE 0 END AS below_floor_consumer FROM ${var.dataset_catalog}.${var.dataset_schema}.table_manifest"
              ]
            },
            {
              "name": "lifecycle_state",
              "displayName": "Lifecycle state",
              "queryLines": [
                "SELECT catalog, schema, COALESCE(state, 'UNKNOWN') AS state, COUNT(*) AS table_count FROM ${var.dataset_catalog}.${var.dataset_schema}.table_manifest GROUP BY catalog, schema, COALESCE(state, 'UNKNOWN')"
              ]
            },
            {
              "name": "review_tables",
              "displayName": "Tables needing review",
              "queryLines": [
                "SELECT catalog, schema, full_name, eligibility, COALESCE(state, 'UNKNOWN') AS state, COALESCE(blockers, '') AS blockers, COALESCE(size_band, 'unknown') AS size_band, COALESCE(path_access_entities, '') AS path_access_entities FROM ${var.dataset_catalog}.${var.dataset_schema}.table_manifest WHERE eligibility <> 'ELIGIBLE' OR state = 'BLOCKED' ORDER BY full_name LIMIT 200"
              ]
            },
            {
              "name": "waves",
              "displayName": "Wave plan",
              "queryLines": [
                "SELECT wave_id, MAX(wave_label) AS wave_label, MAX(bucket) AS bucket, MAX(plan_run_id) AS plan_run_id, MAX(group_key) AS group_key,   COUNT(*) AS tables, SUM(COALESCE(table_size_bytes, 0)) AS total_bytes,   ROUND(SUM(COALESCE(est_data_copy_minutes, 0)), 1) AS sum_copy_minutes,   ROUND(MAX(COALESCE(est_downtime_minutes, 0)), 1) AS max_downtime_minutes,   MAX(recommended_warehouse) AS recommended_warehouse, MAX(COALESCE(recommended_cores, 0)) AS recommended_cores, MAX(max_size_band) AS max_size_band, MAX(CASE WHEN exceeds_wave_byte_cap THEN 1 ELSE 0 END) AS exceeds_wave_byte_cap,   MAX(planned_window) AS planned_window FROM ${var.dataset_catalog}.${var.dataset_schema}.wave_plan GROUP BY wave_id ORDER BY wave_id"
              ]
            },
            {
              "name": "manifest_detail",
              "displayName": "Manifest detail (per table)",
              "queryLines": [
                "SELECT catalog, schema, concat(catalog, '.', schema) AS catalog_schema, table_name, full_name, eligibility, COALESCE(state, 'UNKNOWN') AS state, COALESCE(size_band, 'unknown') AS size_band, COALESCE(blockers, '') AS blockers, COALESCE(table_size_bytes, 0) AS table_size_bytes, ROUND(COALESCE(est_data_copy_minutes, 0), 1) AS est_data_copy_minutes, CASE WHEN eligibility = 'ELIGIBLE' THEN 1 ELSE 0 END AS is_eligible, CASE WHEN eligibility = 'BLOCKED' THEN 1 ELSE 0 END AS is_blocked FROM ${var.dataset_catalog}.${var.dataset_schema}.table_manifest"
              ]
            },
            {
              "name": "risk_by_cs",
              "displayName": "Risk flags by catalog/schema",
              "queryLines": [
                "SELECT catalog, schema, concat(catalog, '.', schema) AS catalog_schema, risk_type, COUNT(*) AS table_count FROM (SELECT catalog, schema, 'UniForm (Iceberg)' AS risk_type FROM ${var.dataset_catalog}.${var.dataset_schema}.table_manifest WHERE uniform_iceberg_enabled UNION ALL SELECT catalog, schema, 'Delta shared' AS risk_type FROM ${var.dataset_catalog}.${var.dataset_schema}.table_manifest WHERE is_delta_shared UNION ALL SELECT catalog, schema, 'External writer' AS risk_type FROM ${var.dataset_catalog}.${var.dataset_schema}.table_manifest WHERE has_external_non_databricks_writer UNION ALL SELECT catalog, schema, 'Needs Compat Mode' AS risk_type FROM ${var.dataset_catalog}.${var.dataset_schema}.table_manifest WHERE needs_compatibility_mode UNION ALL SELECT catalog, schema, 'Streaming writer' AS risk_type FROM ${var.dataset_catalog}.${var.dataset_schema}.table_manifest WHERE has_streaming_writer UNION ALL SELECT catalog, schema, 'Below DBR 15.4 consumer' AS risk_type FROM ${var.dataset_catalog}.${var.dataset_schema}.table_manifest WHERE has_below_floor_consumer UNION ALL SELECT catalog, schema, 'Path-based access' AS risk_type FROM ${var.dataset_catalog}.${var.dataset_schema}.table_manifest WHERE has_path_based_access) GROUP BY catalog, schema, concat(catalog, '.', schema), risk_type"
              ]
            },
            {
              "name": "location_map",
              "displayName": "Storage location map",
              "queryLines": [
                "SELECT\n",
                "  scope_type,\n",
                "  scope_name,\n",
                "  managed_location,\n",
                "  region,\n",
                "  cloud,\n",
                "  updated_at\n",
                "FROM\n",
                "  ${var.dataset_catalog}.${var.dataset_schema}.location_map\n",
                "ORDER BY\n",
                "  scope_type,\n",
                "  scope_name"
              ]
            },
            {
              "name": "streaming_plan",
              "displayName": "Streaming restart plan",
              "queryLines": [
                "SELECT\n",
                "  split_part(full_name, '.', 1) AS catalog,\n",
                "  split_part(full_name, '.', 2) AS schema,\n",
                "  full_name,\n",
                "  job_or_pipeline_id,\n",
                "  type,\n",
                "  role,\n",
                "  owner,\n",
                "  restart_action,\n",
                "  confidence,\n",
                "  updated_at\n",
                "FROM\n",
                "  ${var.dataset_catalog}.${var.dataset_schema}.streaming_plan\n",
                "ORDER BY\n",
                "  full_name"
              ]
            },
            {
              "name": "consumer_runtime_plan",
              "displayName": "Consumer runtime plan",
              "queryLines": [
                "SELECT\n",
                "  split_part(full_name, '.', 1) AS catalog,\n",
                "  split_part(full_name, '.', 2) AS schema,\n",
                "  full_name,\n",
                "  role,\n",
                "  entity_id,\n",
                "  entity_run_id,\n",
                "  compute_id,\n",
                "  cluster_id,\n",
                "  dbr_version,\n",
                "  dbr_major,\n",
                "  dbr_minor,\n",
                "  below_floor,\n",
                "  created_by,\n",
                "  confidence,\n",
                "  updated_at\n",
                "FROM\n",
                "  ${var.dataset_catalog}.${var.dataset_schema}.consumer_runtime_plan\n",
                "ORDER BY\n",
                "  below_floor DESC,\n",
                "  full_name"
              ]
            },
            {
              "name": "eligibility_by_cs",
              "displayName": "Eligibility by catalog.schema",
              "queryLines": [
                "SELECT\n",
                "  concat(catalog, '.', schema) AS catalog_dot_schema,\n",
                "  eligibility,\n",
                "  COUNT(*) AS tableCount\n",
                "FROM\n",
                "  ${var.dataset_catalog}.${var.dataset_schema}.table_manifest\n",
                "GROUP BY\n",
                "  catalog,\n",
                "  schema,\n",
                "  eligibility\n",
                "ORDER BY\n",
                "  COUNT(*) DESC"
              ]
            },
            {
              "name": "recency",
              "displayName": "Access recency / staleness",
              "queryLines": [
                "WITH base AS (\n",
                "  SELECT\n",
                "    catalog,\n",
                "    schema,\n",
                "    concat(catalog, '.', schema) AS catalog_schema,\n",
                "    full_name,\n",
                "    eligibility,\n",
                "    COALESCE(size_band, 'unknown') AS size_band,\n",
                "    COALESCE(table_size_bytes, 0) AS table_size_bytes,\n",
                "    last_write_at,\n",
                "    last_read_at,\n",
                "    COALESCE(write_count, 0) AS write_count,\n",
                "    COALESCE(read_count, 0) AS read_count,\n",
                "    greatest(last_write_at, last_read_at) AS last_access_at,\n",
                "    datediff(current_date(), CAST(greatest(last_write_at, last_read_at) AS DATE)) AS days_since_last_access\n",
                "  FROM ${var.dataset_catalog}.${var.dataset_schema}.table_manifest\n",
                ")\n",
                "SELECT\n",
                "  base.*,\n",
                "  CASE\n",
                "    WHEN days_since_last_access IS NULL THEN 'dormant (>=365d / none)'\n",
                "    WHEN days_since_last_access < 30 THEN 'active (<30d)'\n",
                "    WHEN days_since_last_access < 90 THEN 'warm (30-90d)'\n",
                "    WHEN days_since_last_access < 180 THEN 'cold (90-180d)'\n",
                "    WHEN days_since_last_access < 365 THEN 'stale (180-365d)'\n",
                "    ELSE 'dormant (>=365d / none)'\n",
                "  END AS staleness_band,\n",
                "  CASE WHEN last_access_at IS NULL THEN 1 ELSE 0 END AS never_accessed_flag,\n",
                "  CASE WHEN days_since_last_access IS NULL OR days_since_last_access >= 180 THEN 1 ELSE 0 END AS stale_or_dormant_flag,\n",
                "  CASE WHEN days_since_last_access < 30 THEN 1 ELSE 0 END AS active_flag\n",
                "FROM base\n",
                "ORDER BY days_since_last_access DESC NULLS FIRST, table_size_bytes DESC"
              ]
            },
            {
              "name": "migration_progress",
              "displayName": "Migration progress (per schema)",
              "queryLines": [
                "SELECT catalog, schema, concat(catalog, '.', schema) AS catalog_schema, total_tables, dry_run_ok, converting, converted, validated, cleaned, blocked, rolled_back, migrated_tables, remaining_tables, pct_migrated, pct_validated FROM ${var.dataset_catalog}.${var.dataset_schema}.migration_progress ORDER BY pct_migrated ASC, remaining_tables DESC"
              ]
            },
            {
              "name": "wave_status",
              "displayName": "Wave status",
              "queryLines": [
                "SELECT plan_run_id, wave_id, wave_order, bucket, wave_label, wave_state, open_actions, open_blocking, open_pre_convert, open_post_convert, recommended_warehouse, recommended_cores, total_tables, converted, validated, cleaned, blocked, remaining_tables FROM ${var.dataset_catalog}.${var.dataset_schema}.wave_status ORDER BY wave_order"
              ]
            },
            {
              "name": "path_access_locations",
              "displayName": "Path-based access (tier 2)",
              "queryLines": [
                "SELECT\n",
                "  split_part(full_name, '.', 1) AS catalog,\n",
                "  split_part(full_name, '.', 2) AS schema,\n",
                "  full_name,\n",
                "  entity_kind,\n",
                "  entity_id,\n",
                "  entity_name,\n",
                "  source_path,\n",
                "  cell_index,\n",
                "  line_number,\n",
                "  snippet,\n",
                "  matched_path,\n",
                "  confidence,\n",
                "  updated_at\n",
                "FROM\n",
                "  ${var.dataset_catalog}.${var.dataset_schema}.path_access_locations\n",
                "ORDER BY\n",
                "  confidence DESC,\n",
                "  full_name,\n",
                "  source_path,\n",
                "  line_number"
              ]
            },
            {
              "name": "comms_feed",
              "displayName": "Comms feed (per table)",
              "queryLines": [
                "SELECT\n",
                "  plan_run_id,\n",
                "  wave_id,\n",
                "  wave_order,\n",
                "  wave_label,\n",
                "  full_name,\n",
                "  owners,\n",
                "  downstream_consumers,\n",
                "  downstream_consumer_count,\n",
                "  blast_radius,\n",
                "  est_downtime_minutes,\n",
                "  recommended_cores,\n",
                "  recommended_warehouse,\n",
                "  max_size_band,\n",
                "  planned_window,\n",
                "  updated_at\n",
                "FROM\n",
                "  ${var.dataset_catalog}.${var.dataset_schema}.comms_feed\n",
                "ORDER BY\n",
                "  wave_order,\n",
                "  full_name"
              ]
            },
            {
              "name": "next_action",
              "displayName": "Next action (latest)",
              "queryLines": [
                "SELECT as_of, plan_run_id, estate_total_schemas, estate_pct_migrated, estate_pct_validated, schemas_done, schemas_in_progress, schemas_blocked, next_step_kind, next_step_title, next_group_key, next_bucket, next_selector, mutates, reversible, eta_copy_min, max_downtime_min, recommended_warehouse, recommended_cores, remaining_tables, downstream_count, owners, needs_streaming_restart, needs_reshare, needs_compat, below_floor_consumers, resume_needed, next_next_preview, exact_command, directive FROM ${var.dataset_catalog}.${var.dataset_schema}.migration_next_actions ORDER BY as_of DESC LIMIT 1"
              ]
            },
            {
              "name": "freeze_ledger",
              "displayName": "Freeze ledger (frozen now)",
              "queryLines": [
                "SELECT status, dry_run, op_kind, scope, catalog, schema, full_name, target_kind, target_id, prior_pause_status, prior_po_enabled, prior_run_id, trigger_type, freeze_run_id, plan_run_id, wave_id, frozen_at, frozen_by, evidence, notes FROM ${var.dataset_catalog}.${var.dataset_schema}.freeze_ledger_open ORDER BY status, catalog, schema, table_name"
              ]
            },
            {
              "name": "runbook",
              "displayName": "Runbook (manual statements)",
              "queryLines": [
                "SELECT phase, phase_rank, blocking, scope, catalog, schema, full_name, source_kind, item_kind, title, statement, status, plan_run_id, wave_id FROM ${var.dataset_catalog}.${var.dataset_schema}.migration_runbook ORDER BY phase_rank, blocking DESC, catalog, schema, full_name, source_kind, item_kind"
              ]
            },
            {
              "name": "coverage_report",
              "displayName": "Coverage self-diagnostic (per workspace)",
              "queryLines": [
                "SELECT workspace_id, principal, latest_run_id, finished_at, discovery_source, system_information_schema_ok, catalog_filter, schema_filter, catalogs_visible, catalogs_scanned, catalogs_unscanned, tables_discovered_latest_run, manifest_tables, manifest_blocked, coverage_disclaimer FROM ${var.dataset_catalog}.${var.dataset_schema}.coverage_report ORDER BY finished_at DESC"
              ]
            },
            {
              "name": "coverage_matrix_blindspots",
              "displayName": "Blind spots (bound, not covered)",
              "queryLines": [
                "SELECT `catalog`, binding_type, workspace_id, status, latest_run_id, computed_in_workspace_id, computed_at, notes FROM ${var.dataset_catalog}.${var.dataset_schema}.coverage_matrix WHERE status = 'bound_not_covered' ORDER BY `catalog`"
              ]
            }
          ],
          "pages": [
            {
              "name": "action_queue",
              "displayName": "Actions & Comms",
              "layout": [
                {
                  "widget": {
                    "name": "aq_title",
                    "multilineTextboxSpec": {
                      "lines": [
                        "## Action queue — operator papercuts"
                      ]
                    }
                  },
                  "position": {
                    "x": 0,
                    "y": 0,
                    "width": 12,
                    "height": 1
                  }
                },
                {
                  "widget": {
                    "name": "aq_subtitle",
                    "multilineTextboxSpec": {
                      "lines": [
                        "Every detected papercut as a tracked, idempotent, table- or schema-scoped action. Regenerated each profile; operator/executor columns are preserved and cleared signals become OBSOLETE (never deleted). Source: action_summary / action_queue_open."
                      ]
                    }
                  },
                  "position": {
                    "x": 0,
                    "y": 1,
                    "width": 12,
                    "height": 1
                  }
                },
                {
                  "widget": {
                    "name": "aq_summary",
                    "queries": [
                      {
                        "name": "main_query",
                        "query": {
                          "datasetName": "action_summary",
                          "fields": [
                            {
                              "name": "catalog",
                              "expression": "`catalog`"
                            },
                            {
                              "name": "schema",
                              "expression": "`schema`"
                            },
                            {
                              "name": "action_kind",
                              "expression": "`action_kind`"
                            },
                            {
                              "name": "open",
                              "expression": "`open`"
                            },
                            {
                              "name": "in_progress",
                              "expression": "`in_progress`"
                            },
                            {
                              "name": "done",
                              "expression": "`done`"
                            },
                            {
                              "name": "obsolete",
                              "expression": "`obsolete`"
                            },
                            {
                              "name": "open_blocking",
                              "expression": "`open_blocking`"
                            }
                          ],
                          "disaggregated": true
                        }
                      }
                    ],
                    "spec": {
                      "version": 2,
                      "frame": {
                        "title": "Open actions by kind and schema",
                        "showTitle": true
                      },
                      "widgetType": "table",
                      "encodings": {
                        "columns": [
                          {
                            "fieldName": "catalog",
                            "displayName": "Catalog"
                          },
                          {
                            "fieldName": "schema",
                            "displayName": "Schema"
                          },
                          {
                            "fieldName": "action_kind",
                            "displayName": "Action"
                          },
                          {
                            "fieldName": "open",
                            "displayName": "Open"
                          },
                          {
                            "fieldName": "in_progress",
                            "displayName": "In progress"
                          },
                          {
                            "fieldName": "done",
                            "displayName": "Done"
                          },
                          {
                            "fieldName": "obsolete",
                            "displayName": "Obsolete"
                          },
                          {
                            "fieldName": "open_blocking",
                            "displayName": "Open blocking"
                          }
                        ]
                      },
                      "data": {
                        "queryName": "main_query"
                      }
                    }
                  },
                  "position": {
                    "x": 0,
                    "y": 2,
                    "width": 12,
                    "height": 6
                  }
                },
                {
                  "widget": {
                    "name": "aq_open",
                    "queries": [
                      {
                        "name": "main_query",
                        "query": {
                          "datasetName": "action_queue_open",
                          "fields": [
                            {
                              "name": "blocking",
                              "expression": "`blocking`"
                            },
                            {
                              "name": "phase",
                              "expression": "`phase`"
                            },
                            {
                              "name": "action_kind",
                              "expression": "`action_kind`"
                            },
                            {
                              "name": "status",
                              "expression": "`status`"
                            },
                            {
                              "name": "catalog",
                              "expression": "`catalog`"
                            },
                            {
                              "name": "schema",
                              "expression": "`schema`"
                            },
                            {
                              "name": "full_name",
                              "expression": "`full_name`"
                            },
                            {
                              "name": "target_kind",
                              "expression": "`target_kind`"
                            },
                            {
                              "name": "target_id",
                              "expression": "`target_id`"
                            },
                            {
                              "name": "title",
                              "expression": "`title`"
                            },
                            {
                              "name": "confidence",
                              "expression": "`confidence`"
                            },
                            {
                              "name": "owner",
                              "expression": "`owner`"
                            },
                            {
                              "name": "detected_at",
                              "expression": "`detected_at`"
                            }
                          ],
                          "disaggregated": true
                        }
                      }
                    ],
                    "spec": {
                      "version": 2,
                      "frame": {
                        "title": "Open actions (blocking + pre-convert first)",
                        "showTitle": true
                      },
                      "widgetType": "table",
                      "encodings": {
                        "columns": [
                          {
                            "fieldName": "blocking",
                            "displayName": "Blocking"
                          },
                          {
                            "fieldName": "phase",
                            "displayName": "Phase"
                          },
                          {
                            "fieldName": "action_kind",
                            "displayName": "Action"
                          },
                          {
                            "fieldName": "status",
                            "displayName": "Status"
                          },
                          {
                            "fieldName": "catalog",
                            "displayName": "Catalog"
                          },
                          {
                            "fieldName": "schema",
                            "displayName": "Schema"
                          },
                          {
                            "fieldName": "full_name",
                            "displayName": "Table"
                          },
                          {
                            "fieldName": "target_kind",
                            "displayName": "Target kind"
                          },
                          {
                            "fieldName": "target_id",
                            "displayName": "Target id"
                          },
                          {
                            "fieldName": "title",
                            "displayName": "Title"
                          },
                          {
                            "fieldName": "confidence",
                            "displayName": "Confidence"
                          },
                          {
                            "fieldName": "owner",
                            "displayName": "Owner"
                          },
                          {
                            "fieldName": "detected_at",
                            "displayName": "Detected"
                          }
                        ]
                      },
                      "data": {
                        "queryName": "main_query"
                      }
                    }
                  },
                  "position": {
                    "x": 0,
                    "y": 8,
                    "width": 12,
                    "height": 8
                  }
                },
                {
                  "widget": {
