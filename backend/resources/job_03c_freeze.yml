# Stage 03c — FREEZE: pause compaction + stop streams before a convert (exactly reversible).
# Reads the OPEN PRE_CONVERT freeze/stop actions for a wave (plan_run_id + wave_id) or a
# catalog.schema and pauses jobs / disables Predictive Optimization / stops streams, writing
# the prior state to freeze_ledger so 05b_unfreeze_verify restores exactly. confirm_execute
# defaults to false (dry-run: plan + capture prior state, no API calls). It only ever pauses/
# stops reversible metadata — never deletes data, moves a checkpoint, VACUUMs, or SET MANAGEDs.
resources:
  jobs:
    job_03c_freeze:
      name: "[${bundle.target}] ${bundle.name} :: 03c freeze"
      tags:
        project: managed-migration
        stage: "03c-freeze"
      max_concurrent_runs: 1
      # Serverless compute — runtime is managed by serverless (no DBR pin needed).
      parameters:
        - name: plan_run_id
          default: ""
        - name: wave_id
          default: ""
        - name: target_schema
          default: ${var.target_schema}
        - name: confirm_execute
          default: ${var.confirm_execute}
        - name: operator
          default: ""
      tasks:
        - task_key: freeze
          notebook_task:
            notebook_path: ../notebooks/03c_freeze.py
            base_parameters:
              # Usage telemetry opt-out (deploy-fixed; false = no pings).
              telemetry_enabled: ${var.telemetry_enabled}
              manifest_catalog: ${var.manifest_catalog}
              job_id: "{{job.id}}"
              job_run_id: "{{job.run_id}}"
              manifest_schema: ${var.manifest_schema}
              plan_run_id: "{{job.parameters.plan_run_id}}"
              wave_id: "{{job.parameters.wave_id}}"
              target_schema: "{{job.parameters.target_schema}}"
              confirm_execute: "{{job.parameters.confirm_execute}}"
              operator: "{{job.parameters.operator}}"
              parallelism: ${var.parallelism}
        # Auto-refresh the recommendation after this stage so migration_next_actions moves on
        # (next finish step / next wave / DONE) instead of going stale. The conductor is
        # READ-ONLY; run_if ALL_DONE refreshes even if the stage failed.
        - task_key: recompute_next_step
          depends_on:
            - task_key: freeze
          run_if: ALL_DONE
          run_job_task:
            job_id: ${resources.jobs.job_08_conductor.id}
