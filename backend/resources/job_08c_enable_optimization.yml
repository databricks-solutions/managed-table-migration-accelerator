# Stage 08c — TURN ON LIQUID CLUSTERING (POST_CONVERT; PO is already on after SET MANAGED, so this
# turns it on only where it reads off). The job name below is kept: cockpits, install and e2e find
# the deployed job by its ":: 08c enable predictive optimization" suffix.
# Stage 08c — ENABLE PREDICTIVE OPTIMIZATION + AUTO LIQUID CLUSTERING (POST_CONVERT): turn PO on
# where a converted table has it off, AND enable automatic liquid clustering (CLUSTER BY AUTO) on
# the eligible clean set. PO enable is opt-in (enable_po_on_convert, default false = discovery
# no-op); auto-liquid is default-on but opt-out (auto_liquid_policy, default enable_eligible |
# recommend = advisory-only | off = untouched). Both share one gate (confirm_execute, default
# false = dry-run: prints/persists the exact ALTER … statements, runs nothing). With
# confirm_execute=true it runs PO first then auto-liquid, RE-READS live state, VERIFIES (PO via
# DESCRIBE, auto-liquid via DESCRIBE TABLE EXTENDED AS JSON clusterByAuto), and auto-closes the
# paired ENABLE_PREDICTIVE_OPTIMIZATION / ENABLE_AUTO_LIQUID actions. Never SET MANAGEDs, deletes
# data, or VACUUMs. Bundle-deployed + CLI-runnable, and app-bound as the `enable_optimization`
# alias (the slot freed by un-binding job_09 — see app/resources/app.yml).
resources:
  jobs:
    job_08c_enable_optimization:
      name: "[${bundle.target}] ${bundle.name} :: 08c enable predictive optimization"
      tags:
        project: managed-migration
        stage: "08c-enable-optimization"
      max_concurrent_runs: 1
      parameters:
        - name: plan_run_id
          default: ""
        - name: wave_id
          default: ""
        # Bulk selector (M6.1): with plan_run_id, targets every wave in the batch; takes
        # precedence over wave_id and target_schema (the job_03d_lease_ownership precedent).
        - name: batch_id
          default: ""
        - name: target_schema
          default: ${var.target_schema}
        - name: enable_po_on_convert
          default: "false"
        - name: auto_liquid_policy
          default: "enable_eligible"
        - name: confirm_execute
          default: ${var.confirm_execute}
        - name: operator
          default: ""
      tasks:
        - task_key: enable_optimization
          notebook_task:
            notebook_path: ../notebooks/08c_enable_optimization.py
            base_parameters:
              # Usage telemetry opt-out (deploy-fixed; false = no pings).
              telemetry_enabled: ${var.telemetry_enabled}
              manifest_catalog: ${var.manifest_catalog}
              job_id: "{{job.id}}"
              job_run_id: "{{job.run_id}}"
              manifest_schema: ${var.manifest_schema}
              plan_run_id: "{{job.parameters.plan_run_id}}"
              wave_id: "{{job.parameters.wave_id}}"
              batch_id: "{{job.parameters.batch_id}}"
              target_schema: "{{job.parameters.target_schema}}"
              enable_po_on_convert: "{{job.parameters.enable_po_on_convert}}"
              auto_liquid_policy: "{{job.parameters.auto_liquid_policy}}"
              confirm_execute: "{{job.parameters.confirm_execute}}"
              operator: "{{job.parameters.operator}}"
        # Auto-refresh the recommendation after this stage so migration_next_actions moves on
        # (next finish step / next wave / DONE) instead of going stale. The conductor is
        # READ-ONLY; run_if ALL_DONE refreshes even if the stage failed.
        - task_key: recompute_next_step
          depends_on:
            - task_key: enable_optimization
          run_if: ALL_DONE
          run_job_task:
            job_id: ${resources.jobs.job_08_conductor.id}
