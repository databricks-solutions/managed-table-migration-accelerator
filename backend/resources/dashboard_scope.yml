                {
                  "widget": {
                    "name": "fl_title",
                    "multilineTextboxSpec": {
                      "lines": [
                        "## Freeze ledger — compaction & streaming, exactly reversible"
                      ]
                    }
                  },
                  "position": {
                    "x": 0,
                    "y": 0,
                    "width": 12,
                    "height": 1
                  }
                },
                {
                  "widget": {
                    "name": "fl_subtitle",
                    "multilineTextboxSpec": {
                      "lines": [
                        "Stage 03c FREEZE pauses compaction / stops streams before a convert and records the PRIOR state here; stage 05b UNFREEZE restores exactly that (a job already paused stays paused; PO re-enabled only if it was on). dry_run=true rows are planned-only previews (no API call). Never deletes data / moves a checkpoint / VACUUMs. Source: freeze_ledger_open."
                      ]
                    }
                  },
                  "position": {
                    "x": 0,
                    "y": 1,
                    "width": 12,
                    "height": 2
                  }
                },
                {
                  "widget": {
                    "name": "fl_ledger",
                    "queries": [
                      {
                        "name": "main_query",
                        "query": {
                          "datasetName": "freeze_ledger",
                          "fields": [
                            {
                              "name": "status",
                              "expression": "`status`"
                            },
                            {
                              "name": "dry_run",
                              "expression": "`dry_run`"
