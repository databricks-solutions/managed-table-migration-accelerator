# Stage 06 — Rollback: UNSET MANAGED within the 14-day window. MANUAL TRIGGER ONLY.
# No schedule and no trigger block: this job is only ever started by a human, with a
# required `reason`. Uses the SAME pinned runtime variable as convert.
resources:
  jobs:
    job_06_rollback:
      name: "[${bundle.target}] ${bundle.name} :: 06 rollback (manual)"
      tags:
        project: managed-migration
        stage: "06-rollback"
      parameters:
        - name: full_name
          default: ""
        - name: plan_run_id
          default: ""
        - name: wave_id
          default: ""
        - name: reason
          default: ""
        - name: owning_workspace
          default: ""
        - name: require_owning_workspace
          default: "true"
        # This workspace's numeric id for the ownership guard's CURRENT side (deterministic on
        # serverless). Distinct from owning_workspace, the operator's federation override.
        - name: current_workspace_id
          default: ${var.workspace_id}
        - name: operator
          default: ""
      # Serverless compute — runtime is managed by serverless (no DBR pin needed).
      tasks:
        - task_key: rollback
          notebook_task:
            notebook_path: ../notebooks/06_rollback.py
            base_parameters:
              # Usage telemetry opt-out (deploy-fixed; false = no pings).
              telemetry_enabled: ${var.telemetry_enabled}
              manifest_catalog: ${var.manifest_catalog}
              job_id: "{{job.id}}"
              job_run_id: "{{job.run_id}}"
              manifest_schema: ${var.manifest_schema}
              full_name: "{{job.parameters.full_name}}"
              plan_run_id: "{{job.parameters.plan_run_id}}"
              wave_id: "{{job.parameters.wave_id}}"
              reason: "{{job.parameters.reason}}"
              owning_workspace: "{{job.parameters.owning_workspace}}"
              require_owning_workspace: "{{job.parameters.require_owning_workspace}}"
              current_workspace_id: "{{job.parameters.current_workspace_id}}"
              operator: "{{job.parameters.operator}}"
              parallelism: "2"
        # Auto-refresh the recommendation after UNSET MANAGED changes wave state, so
        # migration_next_actions reflects the rolled-back scope instead of staying stale.
        # Conductor is READ-ONLY; run_if ALL_DONE refreshes even if the rollback failed.
        - task_key: recompute_next_step
          depends_on:
            - task_key: rollback
          run_if: ALL_DONE
          run_job_task:
            job_id: ${resources.jobs.job_08_conductor.id}
