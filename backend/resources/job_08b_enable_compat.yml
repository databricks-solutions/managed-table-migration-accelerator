# Stage 08b — ENABLE COMPATIBILITY MODE (POST_CONVERT): let non-Databricks readers keep reading.
# The post-convert partner for ENABLE_COMPAT actions. Compatibility Mode lets non-Databricks,
# read-only consumers (Athena, Snowflake, Trino, ...) keep reading a table after it becomes MANAGED,
# via delta.universalFormat.enabledFormats='compatibility' + an EMPTY external-location path.
# That location is a human storage decision, so it is supplied via compat_location / compat_location_map;
# a table with no location stays MANUAL. confirm_execute defaults to false (dry-run: prints/persists
# the exact ALTER TABLE ... SET TBLPROPERTIES statement, runs nothing). With confirm_execute=true it
# runs the statement, VERIFIES via table properties, and auto-closes the paired action.
# Never SET MANAGEDs, deletes data, or VACUUMs.
# `finish_action=defer` (with `defer_reason`) sets the scope's open actions DEFERRED so they stop
# holding the wave; `reopen` returns them to OPEN; both are gated by `confirm_execute` and audited.
# `action_keys` (comma-separated) narrows defer/reopen to named actions; the app sends one.
resources:
  jobs:
    job_08b_enable_compat:
      name: "[${bundle.target}] ${bundle.name} :: 08b enable compatibility mode"
      tags:
        project: managed-migration
        stage: "08b-enable-compat"
      max_concurrent_runs: 1
      # Serverless compute — runtime is managed by serverless (no DBR pin needed).
      parameters:
        - name: plan_run_id
          default: ""
        - name: wave_id
          default: ""
        # Bulk selector (M6.1): with plan_run_id, targets every wave in the batch; takes
        # precedence over wave_id and target_schema (the job_03d_lease_ownership precedent).
        - name: batch_id
          default: ""
        - name: target_schema
          default: ${var.target_schema}
        - name: confirm_execute
          default: ${var.confirm_execute}
        - name: finish_action
          default: "run"
        - name: defer_reason
          default: ""
        - name: action_keys
          default: ""
        - name: compat_location
          default: ""
        - name: compat_location_map
          default: ""
        - name: operator
          default: ""
      tasks:
        - task_key: enable_compat
          notebook_task:
            notebook_path: ../notebooks/08b_enable_compat.py
            base_parameters:
              # Usage telemetry opt-out (deploy-fixed; false = no pings).
              telemetry_enabled: ${var.telemetry_enabled}
              manifest_catalog: ${var.manifest_catalog}
              job_id: "{{job.id}}"
              job_run_id: "{{job.run_id}}"
              manifest_schema: ${var.manifest_schema}
              plan_run_id: "{{job.parameters.plan_run_id}}"
              wave_id: "{{job.parameters.wave_id}}"
              batch_id: "{{job.parameters.batch_id}}"
              target_schema: "{{job.parameters.target_schema}}"
              confirm_execute: "{{job.parameters.confirm_execute}}"
              finish_action: "{{job.parameters.finish_action}}"
              defer_reason: "{{job.parameters.defer_reason}}"
              action_keys: "{{job.parameters.action_keys}}"
              compat_location: "{{job.parameters.compat_location}}"
              compat_location_map: "{{job.parameters.compat_location_map}}"
              operator: "{{job.parameters.operator}}"
              refresh_interval: "1 HOUR"
        # Auto-refresh the recommendation after this stage so migration_next_actions moves on
        # (next finish step / next wave / DONE) instead of going stale. The conductor is
        # READ-ONLY; run_if ALL_DONE refreshes even if the stage failed.
        - task_key: recompute_next_step
          depends_on:
            - task_key: enable_compat
          run_if: ALL_DONE
          run_job_task:
            job_id: ${resources.jobs.job_08_conductor.id}
