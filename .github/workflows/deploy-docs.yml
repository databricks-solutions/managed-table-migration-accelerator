name: Deploy Docs

# Builds the Docusaurus site in docs/site/ and publishes it to GitHub Pages.
# Never runs on pull requests (ci.yml builds the site there, without Pages access).
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "backend/docs/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

# Least privilege at the top; the deploy job elevates only what Pages needs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # GitHub-hosted: the org's protected runner groups do not serve public repositories.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pages write scope is confined to this job only.
    permissions:
      pages: write # publish the uploaded artifact to Pages
      id-token: write # OIDC token deploy-pages uses to prove the run's identity (no secret)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
