# Stage 11c — BULK VALIDATE: validate every schema in a batch, bounded-concurrently.
# Read-only on table data (advances CONVERTED -> VALIDATED). Fans the UNCHANGED 05_validate
# out over the batch's DISTINCT schemas (05_validate is schema-scoped). Gates the unfreeze:
# run this to green before job_11d. No freeze coupling, so it is safe to parallelize freely.
resources:
  jobs:
    job_11c_bulk_validate:
      name: "[${bundle.target}] ${bundle.name} :: 11c bulk validate"
      tags:
        project: managed-migration
        stage: "11c-bulk-validate"
      max_concurrent_runs: 1
      parameters:
        - name: plan_run_id
          default: ""
        - name: batch_id
          default: ""
        # Server-injected by the app/MCP for the bulk aliases (OPERATOR_ALIASES); blank = the
        # fanned-out notebook's current_user().
        - name: operator
          default: ""
      tasks:
        - task_key: select_batch
          notebook_task:
            notebook_path: ../notebooks/11_select_batch.py
            base_parameters:
              manifest_catalog: ${var.manifest_catalog}
              manifest_schema: ${var.manifest_schema}
              plan_run_id: "{{job.parameters.plan_run_id}}"
              batch_id: "{{job.parameters.batch_id}}"
              bulk_max_parallel: ${var.bulk_max_parallel}
        - task_key: validate_batch
          depends_on:
            - task_key: select_batch
          for_each_task:
            inputs: "{{tasks.select_batch.values.schema_targets}}"
            concurrency: ${var.bulk_max_parallel}
            task:
              task_key: validate_one_schema
              notebook_task:
                notebook_path: ../notebooks/05_validate.py
                base_parameters:
                  # Usage telemetry opt-out (deploy-fixed; false = no pings).
                  telemetry_enabled: ${var.telemetry_enabled}
                  manifest_catalog: ${var.manifest_catalog}
                  manifest_schema: ${var.manifest_schema}
                  catalog_filter: "{{input.catalog_filter}}"
                  schema_filter: "{{input.schema_filter}}"
                  confirm_streaming: "true"
                  refresh_uniform: "false"
                  operator: "{{job.parameters.operator}}"
        - task_key: recompute_next_step
          depends_on:
            - task_key: validate_batch
          run_if: ALL_DONE
          run_job_task:
            job_id: ${resources.jobs.job_08_conductor.id}
