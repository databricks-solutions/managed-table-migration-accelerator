# Stage 08 — RE-SHARE (Delta Sharing D2D): re-add converted tables to their shares.
# The post-convert partner for RESHARE_D2D actions. D2D recipients are NOT auto-updated after
# SET MANAGED — the shared table must be REMOVEd then ADDed WITH HISTORY so the share tracks the
# new managed location. Reads open RESHARE_D2D actions for a batch (plan_run_id + batch_id), a
# wave (plan_run_id + wave_id) or a catalog.schema, discovers which shares contain each table (SHOW SHARES + SHOW ALL IN SHARE),
# plans the exact ALTER SHARE statements, and — only when confirm_execute=true — runs them, then
# verifies the table is present in the share again and auto-closes the paired action.
# confirm_execute defaults to false (dry-run: prints/persists the exact statements, runs nothing).
# Never SET MANAGEDs, deletes data, or VACUUMs. A table with no attributed share stays MANUAL.
# `finish_action=defer` (with `defer_reason`) sets the scope's open actions DEFERRED so they stop
# holding the wave; `reopen` returns them to OPEN; both are gated by `confirm_execute` and audited.
# `action_keys` (comma-separated) narrows defer/reopen to named actions; the app sends one.
resources:
  jobs:
    job_08_reshare:
      name: "[${bundle.target}] ${bundle.name} :: 08 re-share (D2D)"
      tags:
        project: managed-migration
        stage: "08-reshare"
      max_concurrent_runs: 1
      # Serverless compute — runtime is managed by serverless (no DBR pin needed).
      parameters:
        - name: plan_run_id
          default: ""
        - name: wave_id
          default: ""
        # Bulk selector (M6.1): with plan_run_id, targets every wave in the batch; takes
        # precedence over wave_id and target_schema (the job_03d_lease_ownership precedent).
        - name: batch_id
          default: ""
        - name: target_schema
          default: ${var.target_schema}
        - name: confirm_execute
          default: ${var.confirm_execute}
        - name: finish_action
          default: "run"
        - name: defer_reason
          default: ""
        - name: action_keys
          default: ""
        - name: operator
          default: ""
      tasks:
        - task_key: reshare
          notebook_task:
            notebook_path: ../notebooks/08_reshare.py
            base_parameters:
              # Usage telemetry opt-out (deploy-fixed; false = no pings).
              telemetry_enabled: ${var.telemetry_enabled}
              manifest_catalog: ${var.manifest_catalog}
              job_id: "{{job.id}}"
              job_run_id: "{{job.run_id}}"
              manifest_schema: ${var.manifest_schema}
              plan_run_id: "{{job.parameters.plan_run_id}}"
              wave_id: "{{job.parameters.wave_id}}"
              batch_id: "{{job.parameters.batch_id}}"
              target_schema: "{{job.parameters.target_schema}}"
              confirm_execute: "{{job.parameters.confirm_execute}}"
              finish_action: "{{job.parameters.finish_action}}"
              defer_reason: "{{job.parameters.defer_reason}}"
              action_keys: "{{job.parameters.action_keys}}"
              operator: "{{job.parameters.operator}}"
        # Auto-refresh the recommendation after this stage so migration_next_actions moves on
        # (next finish step / next wave / DONE) instead of going stale. The conductor is
        # READ-ONLY; run_if ALL_DONE refreshes even if the stage failed.
        - task_key: recompute_next_step
          depends_on:
            - task_key: reshare
          run_if: ALL_DONE
          run_job_task:
            job_id: ${resources.jobs.job_08_conductor.id}
